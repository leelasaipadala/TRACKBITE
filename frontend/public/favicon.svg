<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Gradient Background Squircle -->
  <rect width="100" height="100" rx="24" fill="url(#bg-gradient)" />
  <rect width="96" height="96" x="2" y="2" rx="22" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Target Orbit / Pulse Ring -->
  <circle cx="50" cy="46" r="32" stroke="#34D399" stroke-width="2" stroke-dasharray="4 4" opacity="0.3" />
  
  <!-- Fork Handle -->
  <path d="M 50 64 L 50 84 M 43 84 L 57 84" stroke="#34D399" stroke-width="5" stroke-linecap="round" />

  <!-- Nutrition Bar Chart Prongs -->
  <rect x="33" y="36" width="6" height="26" rx="3" fill="#6EE7B7" />
  <rect x="43" y="26" width="6" height="36" rx="3" fill="#34D399" />
  <rect x="53" y="18" width="6" height="44" rx="3" fill="#10B981" />
  <rect x="63" y="12" width="6" height="50" rx="3" fill="#059669" />

  <!-- Upward Health & Macro Trend Swoop -->
  <path d="M 18 56 Q 48 54 82 24" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <circle cx="82" cy="24" r="4" fill="#FBBF24" />

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A" />
      <stop offset="1" stop-color="#020617" />
    </linearGradient>
  </defs>
</svg>